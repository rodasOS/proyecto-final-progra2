# modo: auto | mysql | embebida
#   auto     = usa MySQL externo si 'mysql.url' esta definido; si falla, usa la BD embebida (H2).
#   mysql    = exige MySQL externo; si no conecta, muestra error.
#   embebida = ignora MySQL y usa siempre la BD embebida (H2).
modo=auto
# Ejemplo: jdbc:mysql://localhost:3306/videoclub?createDatabaseIfNotExist=true
mysql.url=
mysql.usuario=root
mysql.clave=
